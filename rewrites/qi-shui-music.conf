// ==UserScript==
// @ScriptName        汽水音乐净化[去广告·保畅听·稳妥版]
// @Author            改写自 @ddgksf2013 墨鱼版（V1.0.6）
// @Function          去开屏/贴片广告；会员弹窗清洗放到「第 5 段」按需开启
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X（[rewrite_local] + [mitm]）
// @Attention         V2.2.0 回退版：不再做会改动响应结构的 jsonjq
// @Attention         装之前务必先停用《汽水音乐规则@墨鱼.conf》，两份规则会打架
// @Version           V2.2.0
// ==/UserScript==


# 只列实际出现过的接口域名；不要用 api*.qishui.com 这类通配，
# 通配会把别的子域也拉进 MITM，一旦某个域带证书校验就会直接「网络异常」。
hostname = beta-luna.douyin.com, api.qishui.com, api5-hl.qishui.com, api3-hl.qishui.com


# =====================================================================
# 第 1 段（默认开启，零风险）：只拦广告素材请求，不碰任何返回内容
# =====================================================================
# > DSP 品牌开屏素材（实测两次请求都是 adslots=[{"slot_id":"200","ad_type":1}]，
#   只服务开屏；激励视频走 73009 / 953854361，不经过这里）
^https:\/\/[^\/]+\/luna\/ads\/dsp\/retrieve url reject-200

# > 品牌开屏（slot 100，返回 launches 列表）
^https:\/\/[^\/]+\/luna\/advert\/splash\/brand\/retrieve url reject-200

# > 贴片广告素材（两次抓包都没触发到，沿用墨鱼版判断；若怀疑它影响广告加载就删这行）
^https:\/\/[^\/]+\/luna\/media_ads url reject-200


# =====================================================================
# 第 2 段（默认开启）：只删「纯开关型」单字段，语法和墨鱼原版同款
# =====================================================================
# > 开屏广告配置块（splash_config 里是 adn_groups / 优先级 / 开通SVIP免广告按钮）
#   激励单元在 ad_unit_configs 里，不受影响。
#   如果开屏还在，看第 5 段第一个可选开关。
^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body 'del(.splash_config)'

# > 「会员免费听整月」引导
^https:\/\/[^\/]+\/luna\/card url jsonjq-response-body 'del(.preview_guide)'

# > 搜索页活动（search_hint 听歌赢签名照 / search_code 推专辑 / search_banner / feed_widget）
^https:\/\/[^\/]+\/luna\/activities url jsonjq-response-body 'del(.activity_map)'

# > 搜索热榜
^https:\/\/[^\/]+\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'


# =====================================================================
# 第 3 段（注意）：这三个接口一个都别动，动了就是「权益没了」
# =====================================================================
#  /luna/commerce/v2/commerce_info  incentive.tasks 看广告进度 + benefit_base.play_track 畅听到期
#  /luna/commerce/v2/upsell         看广告弹窗全部定义在这里
#  /luna/ads/config 的 ad_unit_configs[1]（ad_type=2）  激励视频单元 73009 / 953854361
#  另外 /luna/media-player、/luna/track_v2 里的 limited_free_param.sign 是播放凭证
#
# V2.1.0 就是在这里翻车的：把 commerce_info 的 membership/offers/incentive 子结构删掉，
# 客户端解析失败 → 顶部弹「网络异常」→ 畅听权益读不出来。
# 结论：字节这套 JSON 模型缺字段不是按"可选"处理，删结构 = 删接口。


# =====================================================================
# 第 4 段（排错顺序，出问题照这个顺序删）
# =====================================================================
# 网络异常 + 权益没了  →  ① 墨鱼原规则是不是还开着（最常见，两份规则互相打架）
#                         ② 删掉第 2 段第一条 del(.splash_config)，只留第 1 段
#                         ③ 还异常就是 MITM/证书问题，和本规则无关
# 看广告没入口/转圈    →  /luna/ads/config、/luna/advert/incentive/config、
#                         /luna/commerce/v2/* 被别的规则拦了
# 开屏还在             →  开第 5 段第一个开关（把 ad_type=1 的开屏单元摘掉）
# 歌播不出             →  media-player / track_v2 被动过


# =====================================================================
# 第 5 段（可选，默认关闭；一次只开一条，开完重启 App 验证一次）
# =====================================================================
#
# > 5.1 彻底去开屏：把 ad_type=1 的开屏广告单元从配置里摘掉，只留 ad_type=2 激励视频
#       注意：这里按 ad_type 过滤，不是按下标删，所以不会误删激励单元
# ^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body '.ad_unit_configs|=map(select(.ad_supported_scene.ad_type!=1))'
#
# > 5.2 去「0元开通会员」入口：只删 membership 里的推广子字段，incentive 一个都不动
# ^https:\/\/[^\/]+\/luna\/commerce\/v2\/commerce_info url jsonjq-response-body 'del(.membership.me_tab_vip_entrance,.membership.side_bar_vip_entrance,.membership.default_svip_entrance,.membership.membership_card,.extra.vip_center_quit_retention_popup,.activity_free_vip)'
#
# > 5.3 去会员弹窗：只删下面这些确认存在的 VIP/推广弹窗键（一条 no-op 也不会报错，
#     但列表是照抓包里 upsell_map 的实际 61 个键核过的）；
#     reward_* / preview_popup_ads / rewind_previous_preview_popup_ads /
#     play_entitlement_* / cold_launch_popup_ads_* 这些看广告用的全部保留。
#     冷启动那两个（svip_cold_launch_popup、cold_launch_popup_vip）不在 upsell_map 里，
#     而在 cold_launch_timing.upsell_item_unique_names 中，没有安全的单字段删法，先留着。
# ^https:\/\/[^\/]+\/luna\/commerce\/v2\/upsell url jsonjq-response-body 'del(.upsell_map.background_to_front_popup_vip,.upsell_map.intercept_closed_popup,.upsell_map.me_tab_banner_popup,.upsell_map.me_tab_banner_expired_popup,.upsell_map.me_tab_banner_count_down_popup,.upsell_map.me_tab_download_banner,.upsell_map.me_tab_history_banner,.upsell_map.preview_popup_vip,.upsell_map.preview_popup_downgrade_snackbar_vip,.upsell_map.rewind_previous_preview_popup_vip,.upsell_map.sidebar_vip_popup,.upsell_map.track_list_banner,.upsell_map.feed_mode_vip_only_popup,.upsell_map.play_all_downloaded_song_popup,.upsell_map.dynamic_island_to_front_x0_popup)'
