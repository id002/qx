// ==UserScript==
// @ScriptName        汽水音乐[只去开屏·保畅听]
// @Author            改写自 @ddgksf2013 墨鱼版（V1.0.6）
// @Function          仅移除开屏广告；激励视频、播放、畅听权益链路全部原样
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X（[rewrite_local] + [mitm]）
// @Attention         装之前先停用《汽水音乐规则@墨鱼.conf》，两份规则会打架
// @Attention         默认只开第 1 步，验证没异常再逐级往下开
// @Version           V2.3.0
// ==/UserScript==


hostname = beta-luna.douyin.com, api.qishui.com, api5-hl.qishui.com, api3-hl.qishui.com


# =====================================================================
# 为什么 V2.1 / V2.2 会让你「频繁网络异常 + 畅听不激发」
# =====================================================================
# V2.1 删了 commerce_info 的子结构 → 客户端解析失败；
# V2.2 继续拦 /luna/ads/dsp/retrieve 和 /luna/media_ads → 这两个是广告「素材拉取」，
# 激励视频填不到穿山甲（73009）时会退到 DSP 源（953854361），被 reject 之后：
#   广告加载失败 → App 弹「网络异常」→ 看广告解锁畅听这一步根本走不完。
# 结论：广告素材类请求一律不拦，只让「开屏」不出现在配置里。
#
# 顺带说清楚：reject-200 返回的是「200 + 空 body」，JSON 接口拿到空 body 会抛解析异常；
# 真要拦 JSON 接口，用 reject-dict（返回 {}），比空 body 温和得多。本文件只用 reject-dict。
# =====================================================================


# =====================================================================
# 第 1 步（默认开启，唯一启用的一条）：品牌开屏
# =====================================================================
# slot 100 的品牌开屏拉取，返回的是 launches 列表（空列表 = 没广告）。
# 这条路和激励视频（73009 / 953854361）完全不相干，拦它没有副作用。
# 验证点：装上重启 App，看「网络异常」是否消失、畅听入口是否回来。
^https:\/\/[^\/]+\/luna\/advert\/splash\/brand\/retrieve url reject-dict


# =====================================================================
# 第 2 步（确认第 1 步没事后再开）：把普通开屏单元从配置里摘掉
# =====================================================================
# ads/config 返回 ad_unit_configs 三组：
#   [0] ad_type=1 普通开屏（source1 / slot 890793247）
#   [1] ad_type=2 激励视频（73009 + 953854361）← 必须留着
#   [2] ad_type=1 品牌开屏（source2 / slot 100）
# 这里按 ad_type 过滤而不是按下标删，所以不会误删激励单元；同时删掉 splash_config。
# 如果开这一条之后又出现网络异常 / 广告加载失败，直接把这行删掉，第 1 步已经够用了。
# ^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body '.ad_unit_configs|=map(select(.ad_supported_scene.ad_type!=1))|del(.splash_config)'


# =====================================================================
# 第 3 步（可选，纯页面净化，全部是单字段 del，不碰任何权益字段）
# =====================================================================
# ^https:\/\/[^\/]+\/luna\/card url jsonjq-response-body 'del(.preview_guide)'
# ^https:\/\/[^\/]+\/luna\/activities url jsonjq-response-body 'del(.activity_map)'
# ^https:\/\/[^\/]+\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'


# =====================================================================
# 第 4 步（明确警告：会打断看广告换畅听，只有在你不需要这个奖励时才开）
# =====================================================================
# 这两条是广告素材拉取，激励视频加载失败就是从它们开始的。
# ^https:\/\/[^\/]+\/luna\/ads\/dsp\/retrieve url reject-dict
# ^https:\/\/[^\/]+\/luna\/media_ads url reject-dict


# =====================================================================
# 出问题时按这个顺序排查
# =====================================================================
# 0. 所有规则全关（连 MITM 一起关）跑一次，如果照样频繁「网络异常」，
#    那就和本规则无关 —— 去查 QX 里别的重写/脚本、或证书/代理线路。
# 1. 只开本文件第 1 步，重启 App：网络异常消失、畅听入口在？
# 2. 再开第 2 步：开屏没了？还有异常就删掉第 2 步。
# 3. 第 3 步失败的症状通常是「搜索页/我的页白屏或报错」，删掉对应那条即可。
# 4. 任何时候「看广告领畅听」点了没反应，检查：
#      /luna/ads/config、/luna/advert/incentive/config、/luna/commerce/v2/* 是否被别的规则拦着
#    以及穿山甲域名（pangolin-sdk-toutiao / pglstatp-toutiao / gromore）是否被别的规则拦着
