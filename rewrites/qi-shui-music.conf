// ==UserScript==
// @ScriptName        汽水音乐 测试A（修正版）：只 MITM api5-hl，占位规则
// @Function          让 QX 认可本文件（非空）从而应用 hostname，但不改变任何真实请求
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X
// @Attention         本文件唯一条规则匹配不到任何真实接口，行为影响 = 0
// @Version           Test-A2
// ==/UserScript==


hostname = api5-hl.qishui.com


# =====================================================================
# 为什么要放一条"废规则"
# =====================================================================
# QX 的远程重写资源：只有 hostname 而没有规则时会被判「内容为空」，
# 整个文件不加载 → hostname 也不会并入 MITM → 测试等于没做（上一次就是这样）。
#
# 所以这里放一条永远匹配不到的规则，让文件变成"非空"：
#   路径 /__dsh_mitm_probe__ 在汽水的接口里不存在，两份抓包 131 个 URL 里
#   命中 0 次。它不会拦到任何东西，唯一作用是让 QX 应用上面的 hostname。
#
# 另外这条路也顺便让你能肉眼确认 MITM 真的开了：
# 打开 QX「网络日志」，冷启动 App 后应该能看到
#   api5-hl.qishui.com/luna/track_v2?...   ← 带路径 = MITM 生效
# 而不是只有
#   api5-hl.qishui.com:443                 ← 只有端口 = MITM 没生效
# =====================================================================


^https:\/\/[^\/]+\/__dsh_mitm_probe__ url reject-200


# =====================================================================
# 测试步骤与判读
# =====================================================================
# 1. 停用/删除其它所有汽水规则，只留本文件（避免 hostname 合并引入变量）
# 2. 冷启动 App，切歌 5 次，点几个入口
# 3. 判读：
#    切歌不报「网络异常」 → api5-hl 可以 MITM，走最终版【B】
#    切歌报异常          → api5-hl 不能 MITM（V2.3 的结论坐实），走最终版【C】
# 4. 任何情况下，这条探测规则本身都不该被触发；如果 QX 日志里出现
#    /__dsh_mitm_probe__ 的请求，那说明有别的脚本在拼 URL，先告诉我。
