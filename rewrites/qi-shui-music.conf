// ==UserScript==
// @ScriptName        汽水音乐净化[整合版]
// @Description       穿山甲SDK开屏拦截 + 墨鱼luna接口净化 合并版
// @UpdateTime        2026-09-27
// ==/UserScript==

hostname = api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao1.com, log-api.pangolin-sdk-toutiao.com, vas-lf-x.snssdk.com, *.pglstatp-toutiao.com, *.bytescm.com, beta-luna.douyin.com, api.qishui.com, tnc*-*.zijieapi.com

// ====== 第一部分：穿山甲广告SDK（开屏/激励视频广告源） ======
// 适用：汽水音乐开屏广告、激励视频广告源（hostname 已在本文件头部统一声明）
^https?:\/\/api-access\.pangolin-sdk-toutiao\.com\/ url reject-200
^https?:\/\/api-access\.pangolin-sdk-toutiao1\.com\/ url reject-200
^https?:\/\/log-api\.pangolin-sdk-toutiao\.com\/ url reject-200
^https?:\/\/vas-lf-x\.snssdk\.com\/video\/ url reject-200
^https?:\/\/sf[0-9]*-fe-tos\.pglstatp-toutiao\.com\/ url reject-200
^https?:\/\/lf-cdn-tos\.bytescm\.com\/obj\/static\/ad\/ url reject-200

// ====== 第二部分：墨鱼luna接口净化（V1.0.6） ======
// 适用：汽水音乐应用内各类广告位（原 QiShuiMusicAds.conf）
# > 视频广告
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/media_ads url reject-200
# > 通用广告
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/ads url reject-200
# > 位置隐私
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/location\/info url reject-200
# > 广告弹窗
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/commerce url reject-200
# > TAGS推荐
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/hashtag\/recommend url reject-200
# > 我的页面推广
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/me\? url jsonjq-response-body 'del(.reward_ad_banner)'
# > 会员免费听整月VIEW
# > 【已禁用】del(.preview_guide) 会连带删掉"已领免费听"状态，导致看广告领奖后 VIP 仍只能试听
#^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/card url jsonjq-response-body 'del(.preview_guide)'
# > 热门搜索
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'
# > DNS处理
^https:\/\/tnc.*zijieapi\.com\/get_domains url reject-200
# > 搜索界面活动
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/activities url jsonjq-response-body 'del(.activity_map)'
# > 音乐流推广
^https:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,3}\/luna\/feed\/song-tab url jsonjq-response-body '.items |= map(select(.type == "track"))'
