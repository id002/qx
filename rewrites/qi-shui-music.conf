// ==UserScript==
// @ScriptName        汽水音乐净化[去广告·保畅听]
// @Author            改写自 @ddgksf2013 墨鱼版（V1.0.6）
// @Function          去开屏/贴片/弹窗广告与会员引导，完整保留「看广告领免费畅听」链路
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X / Loon / Surge（URL Rewrite + MITM）
// @Attention         使用前请卸载汽水音乐，挂载规则后重新安装打开
// @Attention         只需 MITM 下面 hostname 里的域名，别把 *.qishui.com 整个放通
// @Version           V2.1.0
// ==/UserScript==


hostname = beta-luna.douyin.com, api.qishui.com, api*.qishui.com


# =====================================================================
# 0. 先读：看广告免费听这条链路，一共 4 个接口撑着，一个都不能整条拦
# =====================================================================
#  /luna/ads/config          ★重点★ 广告位配置，返回里 ad_unit_configs 有三组：
#                              [0] ad_type=1 开屏（slot 890793247）
#                              [1] ad_type=2 激励视频（73009 + 953854361）
#                                  freq_per_day=4，奖励 30分钟×3 + 1天VIP畅听，
#                                  reward_advance_release_days=29
#                              [2] ad_type=1 品牌开屏（slot 100）
#                            墨鱼版用 ^.../luna/ads reject-200 整条拦掉，
#                            等于把 [1] 激励单元也打死 → 「看广告」点了转圈/加载失败。
#                            本规则只摘掉 ad_type=1 的开屏单元 + splash_config。
#
#  /luna/advert/incentive/config   激励视频广告位补充配置（rit 73009 / cid / preload / vids）
#  /luna/commerce/v2/commerce_info incentive.tasks（每日看广告进度）、
#                                  incentive.intercept_popup（弹窗文案 + 「解锁第N日畅听」按钮）、
#                                  benefit_base.play_track.expire_time（畅听到期时间）
#  /luna/commerce/v2/upsell        看广告弹窗全在这里：reward_task_dialog_active/passive、
#                                  reward_ad_cold_launch_popup、preview_popup_ads、
#                                  play_entitlement_expired_popup_* …
#
# 另外两条也别碰：
#   /luna/media-player、/luna/track_v2   limited_free_param 里的 sign 是播放凭证
#   穿山甲域名（pangolin-sdk-toutiao / pglstatp-toutiao / gromore）激励视频素材走那里
# =====================================================================


# =====================================================================
# 1. 开屏广告（只摘开屏，激励单元原样返回）
# =====================================================================
# > 广告位配置：ad_unit_configs 只留非 ad_type=1（即保留激励视频），再删掉 splash_config
#   若开屏仍然出现，多半是客户端用了本地缓存，冷启动一次即可
^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body '.ad_unit_configs |= (if type == "array" then map(select((.ad_supported_scene.ad_type) != 1)) else . end) | del(.splash_config)'

# > DSP 品牌开屏素材拉取（slot 200，响应 ad_launch_list 里是淘宝/腾讯的落地页）
#   抓包里两次请求都是 adslots=[{"slot_id":"200","ad_type":1}]，只服务开屏，
#   激励视频走 73009/953854361，不受影响；万一激励视频加载失败，删掉这一行即可
^https:\/\/[^\/]+\/luna\/ads\/dsp\/retrieve url reject-200

# > 品牌开屏（slot 100，返回 launches 列表）
^https:\/\/[^\/]+\/luna\/advert\/splash\/brand\/retrieve url reject-200

# > 贴片广告素材（本次两次抓包都没触发到，沿用墨鱼版的判断）
^https:\/\/[^\/]+\/luna\/media_ads url reject-200


# =====================================================================
# 2. 「我的」页面：入口反着改——只留看广告领畅听
# =====================================================================
# 墨鱼版是 del(.reward_ad_banner)，等于把「15天 再看4次领第16天畅听」那张卡删了。
# 实测这条 banner 就是「我的」页唯一横幅（banner_list=["reward_ad"]），
# 所以这里保留 reward_ad_banner，只把 banner_list 里的非 reward 项过滤掉。
^https:\/\/[^\/]+\/luna\/me\? url jsonjq-response-body 'if (.me_tab_banners | type) == "object" then .me_tab_banners.banner_list |= (if type == "array" then map(select(tostring | test("reward"))) else . end) else . end'


# =====================================================================
# 3. 商业化信息：摘会员入口和购买推荐，incentive 一个字段都不动
# =====================================================================
# 删：membership 的 0 元开通入口/会员卡、退出挽留弹窗、offers（会员售价）、activity_free_vip，
#     以及 incentive.intercept_popup 里 action=vip 的「x元开通会员」按钮
# 留：incentive.* 全部（tasks / stages / container_popups / intercept_popup 的广告按钮）、
#     benefit_base.play_track（畅听到期）、treasure（金币任务）、membership 其余字段
^https:\/\/[^\/]+\/luna\/commerce\/v2\/commerce_info url jsonjq-response-body '.membership |= (if type == "object" then del(.me_tab_vip_entrance, .side_bar_vip_entrance, .default_svip_entrance, .membership_card) else . end) | .extra |= (if type == "object" then del(.vip_center_quit_retention_popup) else . end) | del(.offers, .activity_free_vip) | .incentive |= (if type == "object" then .intercept_popup |= (if type == "object" then .button |= (if type == "array" then map(select(.action != "vip")) else . end) else . end) else . end)'


# =====================================================================
# 4. 弹窗清单：白名单，只保留 reward / ads / coin / play_entitlement
# =====================================================================
# 墨鱼版整条 /luna/commerce 拦掉，把这些看广告弹窗一起干掉了。
# 这里 upsell_map、freq_ctrl_map、开屏弹窗时序三处同步过滤（三次抓包 keys 完全一致，61 项）：
#   留 20 项：reward_task_dialog_active/passive、reward_ad_cold_launch_popup、preview_popup_ads、
#             play_entitlement_expired_popup_progress、me_tab_reward_ad_banner …
#   丢 41 项：svip/vip 弹窗、音质音效、下载、榜单横幅、退出挽留 …
^https:\/\/[^\/]+\/luna\/commerce\/v2\/upsell url jsonjq-response-body '.upsell_map |= (if type == "object" then with_entries(select(.key | test("reward|ads|coin|play_entitlement"))) else . end) | if (.freq_ctrl_cfg | type) == "object" then .freq_ctrl_cfg.freq_ctrl_map |= (if type == "object" then with_entries(select(.key | test("reward|ads|coin|play_entitlement"))) else . end) else . end | if (.cold_launch_timing | type) == "object" then .cold_launch_timing.upsell_item_unique_names |= (if type == "array" then map(select((test("reward|ads|coin|play_entitlement")) and ((test("vip")) | not))) else . end) else . end'


# =====================================================================
# 5. 播放卡片 / 活动 / 搜索 / 推荐流
# =====================================================================
# > 「会员免费听整月」引导（现版本 preview_guide 已是 null，留着兼容旧版）
^https:\/\/[^\/]+\/luna\/card url jsonjq-response-body 'del(.preview_guide)'

# > 搜索页活动：activity_map 里是 search_hint（🎁听歌赢亲签）、search_code（推专辑）、
#   search_banner、popup、feed_widget，全属推广
^https:\/\/[^\/]+\/luna\/activities url jsonjq-response-body 'del(.activity_map)'

# > 搜索热榜
^https:\/\/[^\/]+\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'

# > 推荐流 / 听视频流：只剔除 type 里带 ad/advert/commerce/promotion 的卡片
#   注意：墨鱼版写的是 map(select(.type == "track"))，而实测 items 里除了 track，
#   还有 video_track_mix（带 #话题 的音乐视频，是正常内容不是广告），会被一起删掉。
#   这两条响应里目前根本没有广告卡片（插播广告靠 /luna/media_ads 拉素材），
#   所以下面只是兜底过滤，不会误删内容。
^https:\/\/[^\/]+\/luna\/feed\/song-tab url jsonjq-response-body '.items |= (if type == "array" then map(select(if (.type | type) == "string" then ((.type | test("ad|advert|commerce|promotion")) | not) else true end)) else . end)'
^https:\/\/[^\/]+\/luna\/feed\/listen-video-tab url jsonjq-response-body '.items |= (if type == "array" then map(select(if (.type | type) == "string" then ((.type | test("ad|advert|commerce|promotion")) | not) else true end)) else . end)'


# =====================================================================
# 6. 可选开关（默认关闭，需要时去掉行首的 # ）
# =====================================================================
# > 关位置上报：少一个隐私接口，但「同城/附近」推荐会变弱
# ^https:\/\/[^\/]+\/location\/info url reject-200
#
# > 关搜索联想的推广话题（本次抓包未触发）
# ^https:\/\/[^\/]+\/luna\/hashtag\/recommend url reject-200


# =====================================================================
# 7. 排错
# =====================================================================
# 开屏还在？           → 客户端缓存了旧 ads/config，冷启动一次；或把 ads/config 那行临时改成 reject-200
# 看广告转圈/没反应？  → ①ads/config 那行是不是被别的规则整条拦了（墨鱼原版就是）
#                        ②穿山甲域名被别的规则拦了（pangolin-sdk-toutiao 等）
#                        ③广告 SDK 首次加载要联网拉素材，等几秒
# 看广告入口没了？     → /luna/me、/luna/commerce/v2/commerce_info、/luna/commerce/v2/upsell
#                        三条被旧规则拦了，检查是否还挂着墨鱼原版（两份会打架）
# 歌播不出/一直转圈？  → /luna/media-player、/luna/track_v2 被动过，删掉相关规则
# 畅听进度不涨？       → 广告要播完倒计时才计数；且需与安卓端同一账号
