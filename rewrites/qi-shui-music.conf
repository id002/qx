// ==UserScript==
// @ScriptName        汽水音乐[去开屏·保畅听] V2.4
// @Author            改写自 @ddgksf2013 墨鱼版（V1.0.6）
// @Function          只改开屏广告配置；播放、畅听、看广告链路一律不碰
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X（[rewrite_local] + [mitm]）
// @Attention         hostname 只保留墨鱼原版那两个域，不 MITM api5-hl.qishui.com
// @Attention         装之前先停用《汽水音乐规则@墨鱼.conf》
// @Version           V2.4.1
// ==/UserScript==


# =====================================================================
# V2.3 的结论：问题不在规则，在 MITM 的域名
# =====================================================================
# v2.3 里只剩一条规则（品牌开屏），而且只在冷启动时请求一次，
# 切歌/点击根本走不到它 —— 所以「切歌才报网络异常」不可能是这条规则造成的。
# 唯一和之前不同的是 hostname：
#   V2.3（我加的）：beta-luna.douyin.com, api.qishui.com, api5-hl.qishui.com, api3-hl.qishui.com
#   墨鱼原版      ：beta-luna.douyin.com, api.qishui.com
# 你这台机器上 36 条 API 请求走的是 api5-hl.qishui.com —— 墨鱼那套规则在你这儿其实
# 大半个都没生效，而我把它拉进了 MITM。客户端检测到部分请求被解密/校验不通过时会
# 走备用域重试（所以歌照放），但每次重试都会弹一次「网络异常」——
# 这正是「切歌/点击时才报」的形状。
# 本文件把 hostname 收回到墨鱼原版那两个域。
# =====================================================================


hostname = beta-luna.douyin.com, api.qishui.com


# =====================================================================
# 第 1 条（默认开启）：把开屏单元从广告配置里摘掉
# =====================================================================
# ads/config 的 ad_unit_configs 三组：
#   [0] ad_type=1 普通开屏（source1 / slot 890793247）
#   [1] ad_type=2 激励视频（73009 + 953854361）← 保留
#   [2] ad_type=1 品牌开屏（source2 / slot 100）
# 按 ad_type 过滤而不是按下标删，激励单元不会被动到；
# 广告素材接口（dsp/retrieve、media_ads）一条都没拦。
#
# ★ 如果切歌/点击又出现「网络异常」，先把下面这一行注释掉再测：
#   注释掉就等于 0 条规则、只剩 MITM 两个域。
#   如果那样就不报了 —— 说明是你这版 App 对 ads/config 改写敏感，开屏只能放弃；
#   如果注释掉还报 —— 说明连这两个域的 MITM 都让它不安，把 hostname 也删掉，
#   那 QX 这条路在你这台机器上就走不通了，不是规则写法的问题。
^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body '.ad_unit_configs|=map(select(.ad_supported_scene.ad_type!=1))|del(.splash_config)'


# =====================================================================
# 第 2 组（可选，都是单字段 del，和墨鱼原版同款语法）
# =====================================================================
# 注意：/luna/card 和品牌开屏在抓包里走的是 api5-hl，现在不在 MITM 里，
# 这两条对它们不会生效（写了也无害）。真正会命中这两个域的是下面三条。
#
# ^https:\/\/[^\/]+\/luna\/activities url jsonjq-response-body 'del(.activity_map)'
# ^https:\/\/[^\/]+\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'
# ^https:\/\/[^\/]+\/luna\/card url jsonjq-response-body 'del(.preview_guide)'


# =====================================================================
# 永远不要开的（记录一下，免得以后手滑）
# =====================================================================
# ^https:\/\/[^\/]+\/luna\/ads\/dsp\/retrieve     广告素材，激励视频备用源，拦了看广告就废
# ^https:\/\/[^\/]+\/luna\/media_ads               同上
# ^https:\/\/[^\/]+\/luna\/commerce\/v2\/.*        incentive.tasks / 畅听到期都在这
# ^https:\/\/[^\/]+\/luna\/me                       reward_ad_banner 是「再看4次领第16天畅听」入口
# ^https:\/\/[^\/]+\/luna\/media-player             limited_free_param.sign 是播放凭证
# ^https:\/\/[^\/]+\/luna\/track_v2                 同上


# =====================================================================
# 附：还残留的开屏广告，要在 QX「分流 / 过滤器」里加域名规则
#     （这几行不写进重写文件，写进去也不生效）
# =====================================================================
# 你看到的开屏素材是淘宝图 —— 抓包里两次 /luna/ads/dsp/retrieve 的 creative 全是：
#   https://qh-material.taobao.com/auto/aigc/pic/AI_FLOW_PIC_*.jpg   (1080x1920)
#   落地页 pages-fast.m.taobao.com / pages.tmall.com
# 但 dsp/retrieve 在 api5-hl.qishui.com 上，而 api5-hl 一 MITM 就报网络异常，
# 所以接口拦不到，只能在域名层拦素材。
#
# 把下面两行加到 QX 配置的 [filter_local]（或「分流规则 → 本地」）：
#
#   HOST,qh-material.taobao.com,REJECT
#   HOST,dig.zjurl.cn,REJECT
#
# 顺序建议：先只加第一行，冷启动 3 次看开屏是否消失（变成一闪而过的黑屏也算成功）。
# 如果还能出图，说明 App 用 dig.zjurl.cn 解析了淘宝域名，再加第二行。
# 注意 dig.zjurl.cn 也给别的 CDN 做解析，加它之后若发现封面/音质图加载变慢，就撤掉。


