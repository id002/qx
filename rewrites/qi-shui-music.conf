// ==UserScript==
// @ScriptName        汽水音乐[去开屏·保畅听] 定稿
// @Author            改写自 @ddgksf2013 墨鱼版（V1.0.6）
// @Function          接口层只改 ads/config；开屏素材走 QX 分流拦截
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X
// @Attention         不要 MITM api5-hl.qishui.com（实测时好时坏，会报网络异常）
// @Attention         先停用其它所有汽水规则，hostname 会合并
// @Version           V2.5.0
// ==/UserScript==


hostname = beta-luna.douyin.com, api.qishui.com


# =====================================================================
# 结论记录（这些是实测出来的，不是推测）
# =====================================================================
# 1. 开屏广告的配置和素材都在 api5-hl.qishui.com 上
#      ads/config（api5-hl 那份）、ads/dsp/retrieve、advert/splash/brand/retrieve
# 2. api5-hl.qishui.com 挂 MITM 会时好时坏：
#      某次冷启动 MITM 生效 → 请求失败 → 「网络出错」+ 没有开屏
#      某次冷启动 MITM 没生效 → 一切正常 + 开屏照旧
#    所以这个域名不能碰。MITM 生效的那几次恰好证明「开屏靠 api5-hl 拉」。
# 3. 由此推出：QX 的接口层改写没法去掉开屏，只能在域名层拦素材。
# 4. 能碰的只有这两个域：beta-luna.douyin.com、api.qishui.com
#    （墨鱼原版也就是这两个，没动过 api5-hl）


# =====================================================================
# 规则（只留这一条，改 api.qishui.com 下发的那份广告配置）
# =====================================================================
# ad_unit_configs 三组：ad_type=1 开屏 ×2、ad_type=2 激励视频 ×1
# 按 ad_type 过滤，只摘开屏组，激励单元（73009 / 953854361）原样保留；再删 splash_config。
# 这条已经过 V2.4.1 实测：不报错、畅听正常，所以留着（对 api5-hl 那份无效，但不影响任何东西）。
^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body '.ad_unit_configs|=map(select(.ad_supported_scene.ad_type!=1))|del(.splash_config)'


# =====================================================================
# 可选（单字段 del，和墨鱼原版同款语法；只在这两个域上生效）
# =====================================================================
# ^https:\/\/[^\/]+\/luna\/activities url jsonjq-response-body 'del(.activity_map)'
# ^https:\/\/[^\/]+\/luna\/search-block url jsonjq-response-body 'del(.search_chart_block)'
# ^https:\/\/[^\/]+\/luna\/card url jsonjq-response-body 'del(.preview_guide)'


# =====================================================================
# 开屏素材拦截：加到 QX 的 [filter_local]（或「分流规则 → 本地」）
#     注意，这两行不写进本文件，写进来也不生效
# =====================================================================
# 抓包里两次 ads/dsp/retrieve 的 creative 全是同一个域名：
#   https://qh-material.taobao.com/auto/aigc/pic/AI_FLOW_PIC_*.jpg  (1080x1920)
#   落地页 pages-fast.m.taobao.com / pages.tmall.com
#
#   HOST,qh-material.taobao.com,REJECT
#   HOST,dig.zjurl.cn,REJECT
#
# 顺序：先只加第一行，冷启动 3 次。变成"一闪而过的黑屏/空白"也算成功（素材没了，App 还在等广告位）。
# 如果还能出图，说明 App 用 dig.zjurl.cn 解析了淘宝域名，再加第二行；
# 但 dig.zjurl.cn 也给别的 CDN 做解析，加了之后封面/图片变慢就撤掉。
#
# 如果加了两行还能出图，那开屏不是淘宝图，而是穿山甲（CSJ）视频开屏——
# 那就到此为止：CSJ 的域名同时承载激励视频（rit 73009），拦了它「看广告换畅听」一起废。
#
# 【实测补充】只加 HOST,qh-material.taobao.com,REJECT 的结果是「时有时无」。
# 原因：App 会先用 dig.zjurl.cn 把素材域名解析成 IP 再直连（QX 有时认得出 SNI、
# 有时认不出），加上 reward_config.preload=true 的预加载缓存，拦截必然滞后。
# 再补 HOST,dig.zjurl.cn,REJECT 能提高命中率，但仍无法做到每次都干净：
# 素材有多个源（淘宝图 / 品牌图 / 穿山甲视频），拦一个域名只覆盖一部分。
# 结论：这个方向到此为止，保持「畅听可用 + 开屏偶发」。


# =====================================================================
# 【iPhone 专用策略】只需要权益、不需要广告
# =====================================================================
# 前提：看广告换畅听在安卓上做，iPhone 只负责「享受权益」。
# 权益是服务端字段（commerce_info 的 benefit_base.play_track.expire_time），
# 和广告 SDK 无关 —— 所以在 iPhone 上拦广告 SDK 不会伤到权益，
# 这等于把「不能拦广告」这条约束解除了。
#
# 开屏有三个来源，每次冷启动靠竞价决定，所以拦了淘宝图之后会「时有时无」：
#   · 淘宝图 DSP   qh-material.taobao.com      ← 已拦
#   · 品牌图       slot 100
#   · 穿山甲视频   slot 890793247              ← iPhone 上可以拦，因为不需要它
#
# 加到 QX 的 [filter_local]（分流规则 → 本地），第一阶段：
#   HOST,qh-material.taobao.com,REJECT
#   HOST,dig.zjurl.cn,REJECT
#
# 第二阶段（清穿山甲那一路，按需加）：
#   HOST-SUFFIX,pangolin-sdk-toutiao.com,REJECT
#   HOST-SUFFIX,pglstatp-toutiao.com,REJECT
#   HOST-SUFFIX,gromore.cn,REJECT
#   HOST-SUFFIX,oceanengine.com,REJECT
#
# 代价：
#   1. 若加第二阶段后弹「网络异常」，说明 App 受不了穿山甲初始化失败，撤掉，退回第一阶段。
#   2. 权益到期时如果人在 iPhone 上，没广告可看就续不了时长，得回安卓补。
#
# 注意：第二阶段那四个域名是穿山甲常见域名，**没有 iOS 端抓包实证**
# （两份抓包里都没有 pangolin 请求，因为 iOS 从没播放过激励视频）。
# 想要精确到行，冷启动带开屏时抓一份 HAR，看素材请求落在哪个域名。


# =====================================================================
# 永远不要开（手滑清单）
# =====================================================================
# ^https:\/\/[^\/]+\/luna\/ads\/dsp\/retrieve      广告素材，也是激励视频的备用源
# ^https:\/\/[^\/]+\/luna\/media_ads                同上
# ^https:\/\/[^\/]+\/luna\/commerce\/v2\/.*         incentive.tasks / 畅听到期都在这
# ^https:\/\/[^\/]+\/luna\/me                       reward_ad_banner 是「再看4次领第16天畅听」入口
# ^https:\/\/[^\/]+\/luna\/media-player             limited_free_param.sign 是播放凭证
# ^https:\/\/[^\/]+\/luna\/track_v2                 同上
# hostname 里加 api5-hl.qishui.com                  会时好时坏地报网络异常
