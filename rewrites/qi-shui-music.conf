// @Author            诊断用，不净化、不改任何返回
// @Function          单独验证 api5-hl.qishui.com 能不能挂 MITM
// @UpdateTime        2025-11-03
// @Suitable          Quantumult X
// @Attention         本文件启用规则数 = 0，只用于定位，验证完就卸掉
// @Version           Test-A
// ==/UserScript==


# =====================================================================
# 这个文件干什么
# =====================================================================
# 只做一件事：把 api5-hl.qishui.com 放进 MITM 列表，规则一条都不写。
# 目的是把「MITM 这个域名」和「改返回内容」彻底分开。
# V2.1/V2.2 是 4 个域 + 一堆 jq，V2.3 是 4 个域 + 1 条规则，
# 每次都混着两个变量，所以「api5-hl 不能 MITM」这个结论其实没被单独验证过。
#
# 期望结果：
#   切歌 5 次 / 点几个入口，如果【不报网络异常】→ api5-hl 可以 MITM，
#   那就可以在接口层把开屏配置摘干净，权益也不受影响。
#   如果【照旧报异常】→ 才能确认是 api5-hl 本身的问题。
# =====================================================================


hostname = api5-hl.qishui.com


# =====================================================================
# 规则区：故意留空
# =====================================================================
# 下面两条只是「装了之后怎么确认 MITM 真的生效」的参照，不要取消注释。
#
# 确认方法：打开 QX 的「网络日志 / 会话」，冷启动 App 后看有没有这种记录——
#     带路径的：  api5-hl.qishui.com/luna/track_v2?...        → MITM 已生效（这就是我们要的状态）
#     只有域名的：api5-hl.qishui.com:443（CONNECT，无路径）    → MITM 没生效，测试无效，检查证书/域名拼写
#
# （以前出现过的联动写法，仅备份，不启用）
# ^https:\/\/[^\/]+\/luna\/ads\/config url jsonjq-response-body 'del(.splash_config)'


