hostname = apiv4-iyes.youku.com, ykimg.alicdn.com, wgo.mmstat.com

# ====== 优酷视频去广告 ======
# 1. 55秒前贴片广告视频流 (m3u8+ts) ⚠风险条:报网络异常就删本条
^https?:\/\/[a-zA-Z0-9_.-]+\.cibntv\.net\/.*duration=55 url reject-200
# 2. 广告创意素材包 (互动广告zip)
^https?:\/\/ykimg\.alicdn\.com\/product\/xfile\/ url reject-200
# 3. iYes 广告SDK IP反射
^https?:\/\/apiv4-iyes\.youku\.com\/reflect\/ip url reject-200
# 4. 阿里妈妈广告监测像素
^https?:\/\/wgo\.mmstat\.com\/ url reject-200