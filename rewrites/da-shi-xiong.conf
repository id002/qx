// ==UserScript==
// @ScriptName        大师兄净化[验证版]
// @Description       大师兄影视去广告-本地验证版（app[0-9]*.dsx.ac）
// @UpdateTime        2026-09-26
// ==/UserScript==

hostname = *.dsx.ac

# > 过滤配置列表（兼容 HTTP/HTTPS）
^https?:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/api\/v\d\/config\/getConfigList\.do url jsonjq-response-body '.data |= map(select(.keyName | test("config\\.(ad|search|recommend)") | not))'
# > 拦截版本/公告/广告
^https?:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/.*?\/v\d\/(version|notice\?|top_notice\?|advert\?position=[^2]+) url reject-200
# > 处理首页/日志横幅与置顶（app2.dsx.ac 等均覆盖）
^https?:\/\/app[0-9]*\.dsx\.ac\/ndsx\.php\/v\d\/logs url jsonjq-response-body 'del(.data.banners) | if .data.is_top then .data = [] else . end'
