// ==UserScript==
// @ScriptName        爱思助手去广告[抓包整合版]
// @Description       爱思助手主界面广告 + 开屏接口 + 广告图拦截（sgmodule+抓包整合）
// @UpdateTime        2026-09-27
// ==/UserScript==

hostname = list-app-m.i4.cn

# ====== 爱思助手去广告 ======
# > 主界面广告清理：删4个广告字段，app列表完整保留(140KB->25KB)
^https?:\/\/list-app-m\.i4\.cn\/getAppList\.xhtml url jsonjq-response-body 'del(.ad) | del(.adli) | del(.spappli) | del(.bannerMenuItem)'
# > 开屏广告接口
^https?:\/\/list-app-m\.i4\.cn\/getopfstadinfo\.xhtml url reject-200
# > 广告点击上报
^https?:\/\/list-app-m\.i4\.cn\/adclickcb\.xhtml url reject-200
# > 热搜列表（含推广位）
^https?:\/\/list-app-m\.i4\.cn\/getHotSearchList\.xhtml url reject-200
# > 广告图/开屏图下载拦截（纯明文HTTP，不加 MITM hostname；只拦 /adInfo/ 广告路径，不影响 /image/icon/ 应用图标）
^http:\/\/d\.image\.i4\.cn\/adInfo\/ url reject-img
