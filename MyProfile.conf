// ==UserScript==
// @ConfigName        我的专属 QuantumultX 配置
// @Author            基于 @ddgksf2013 (墨鱼手记) 规则库定制
// @Source            https://github.com/ddgksf2013/ddgksf2013
// @UpdateTime        2026/09/19
// @MainFunction      去开屏广告、应用净化、会员解锁、智能分流、自动优选、图标订阅、流媒体查询、BoxJS
// @ConfigVersion     1.0
// ==/UserScript==

// ═══════════════════════════════════════════════════════════════
//  使用说明（导入前必读）
//  1. 把下面 [server_remote] 里的【替换为你的机场订阅链接】改成你自己的订阅
//  2. 导入后在「设置 → 解析服务器」确认 resource_parser_url 已生效
//  3. 「MitM」里需要安装证书并信任，详见 docs/操作手册.md
//  4. 不需要的功能可把对应行末尾的 enabled=true 改成 false
// ═══════════════════════════════════════════════════════════════


# > GeoLite2 数据库来源（「其他设置 → GeoLite2 → 来源」任选其一，开启自动更新）
; https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
; https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

# > 广电用户微信转圈：打开 QX「VPN → 兼容性增强」（会导致部分去广告失效）
# > 推荐设置：通知里只开「策略检测通知」「脚本通知」；VPN 里关「兼容性增强」「分流匹配优化」「MPM」


[general]

# 节点延迟测试地址
server_check_url = http://www.gstatic.com/generate_204
# 节点测试超时（毫秒）
server_check_timeout = 3000
# 配置图标
profile_img_url = https://github.githubassets.com/images/modules/site/integrators/google.png
# 节点 IP 归属地检测（disabled=关闭；需要可取消注释下面一行）
geo_location_checker = disabled
;geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 资源解析器（重要！用于把订阅/规则转换成 QX 格式）
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 不走 QX 的内网/特殊地址
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# 屏蔽 QUIC/STUN 提升去广告稳定性（QX ≥ 1.5.2）
udp_drop_list = 443, STUN, QUIC
# 不做 DNS 解析的域名（银行/保险类）
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# 根据 WiFi 自动切换模式（默认关闭，需要时去掉 # 并改成你自己的 WiFi 名）
#running_mode_trigger = filter, filter, HomeWiFi:all_direct, OfficeWiFi:all_direct


[task_local]

# 流媒体解锁查询（点击右上角任务图标运行）
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询, img-url=arrowtriangle.right.square.system, enabled=true
# 节点纯净度查询
event-interaction https://ddgksf2013.top/scripts/server-info-pure.js, tag=节点纯净度详情, img-url=checkmark.shield.fill.system, enabled=true


